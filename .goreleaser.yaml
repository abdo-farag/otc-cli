version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/otc-cli
    binary: otc-cli
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/abdo-farag/otc-cli/cli.version={{.Version}}
      - -X github.com/abdo-farag/otc-cli/cli.commit={{.Commit}}
      - -X github.com/abdo-farag/otc-cli/cli.buildDate={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: abdo-farag
    name: otc-cli
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## OTC CLI {{ .Tag }} ({{ .Date }})
    
    Welcome to this new release of OTC CLI!
  footer: |
    ## Installation
    
    ### Using Go Install
    ```bash
    go install github.com/abdo-farag/otc-cli/cmd/otc-cli@{{ .Tag }}
    ```
    
    ### Manual Installation
    Download the appropriate binary for your platform from the assets below.
    
    **Full Changelog**: https://github.com/abdo-farag/otc-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
